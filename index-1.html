<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ألبان توكل | سوبر ماركت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f8f5;color:#173b28}
header{background:linear-gradient(135deg,#08763f,#28a45d);color:#fff;padding:25px 15px;text-align:center}
.logo{width:90px;height:90px;margin:auto;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:42px}
h1{margin:10px 0 4px}.sub{opacity:.9}.wrap{max-width:1000px;margin:auto;padding:15px}
input,select,button{font:inherit}.search{width:100%;padding:15px;border:0;border-radius:14px;box-shadow:0 2px 12px #0001;margin-bottom:12px}
.cats{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.cats button{border:0;border-radius:20px;padding:9px 15px;white-space:nowrap;background:#dfece4;color:#17613b}.cats .active{background:#16884c;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}.card{background:white;border-radius:16px;padding:12px;min-height:205px;box-shadow:0 3px 14px #0001;display:flex;flex-direction:column}.pic{height:105px;background:#eef6f0;border-radius:12px;display:grid;place-items:center;font-size:42px}.name{font-weight:bold;margin-top:9px;line-height:1.4}.cat{font-size:12px;color:#718278}.price{margin-top:auto;padding-top:8px;color:#087b42;font-size:19px;font-weight:bold}
.admin{background:#fff;margin-top:20px;padding:16px;border-radius:18px;box-shadow:0 3px 14px #0001}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row input{padding:11px;border:1px solid #d4dfd8;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 15px;margin-top:9px}.primary{background:#16884c;color:#fff}.item{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f5f8f6;padding:9px;border-radius:10px;margin-top:8px}.danger{background:#ffe6e6;color:#a00000}
@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div class="logo">🛒</div><h1>ألبان توكل</h1><div class="sub">سوبر ماركت • منتجات وأسعار</div></header>
<main class="wrap">
<input id="search" class="search" placeholder="🔎 ابحث عن منتج...">
<div id="cats" class="cats"></div>
<div id="grid" class="grid"></div>

<section class="admin">
<h2>⚙️ إدارة المنتجات</h2>
<p>تقدر تضيف وتعدل وتحذف المنتجات من هذا الجهاز. الربط بقاعدة بيانات مشتركة لكل العملاء نعمله في الخطوة التالية.</p>
<div class="row">
<input id="name" placeholder="اسم المنتج">
<input id="price" type="number" step="0.01" placeholder="السعر بالجنيه">
<input id="category" placeholder="القسم">
<input id="icon" placeholder="رمز المنتج" value="🛍️">
</div>
<button class="btn primary" onclick="saveProduct()">➕ إضافة المنتج</button>
<div id="adminList"></div>
</section>
</main>
<footer style="text-align:center;padding:25px;color:#718278">ألبان توكل © 2026</footer>

<script>
const initial=[
["لبن كامل الدسم 1 لتر",44.5,"ألبان وبيض","🥛"],
["زبادي طبيعي",7.5,"ألبان وبيض","🥣"],
["بيض 30 بيضة",92,"ألبان وبيض","🥚"],
["أرز","", "بقالة","🍚"],
["سكر","", "بقالة","🧂"],
["زيت","", "بقالة","🫗"],
["عصير","", "مشروبات","🧃"],
["مياه معدنية","", "مشروبات","💧"],
["بسكويت","", "سناكس وحلويات","🍪"],
["شيبسي","", "سناكس وحلويات","🥔"],
["مسحوق غسيل","", "منظفات","🧺"],
["صابون","", "عناية شخصية","🧼"]
];
let products=JSON.parse(localStorage.getItem("tawakal_products")||"null")||initial.map(x=>({name:x[0],price:x[1],category:x[2],icon:x[3]}));
let active="الكل",edit=-1;
const $=x=>document.getElementById(x);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){
let cats=["الكل",...new Set(products.map(p=>p.category))];
$("cats").innerHTML=cats.map(c=>`<button class="${c==active?"active":""}" onclick="active=${JSON.stringify(c)};render()">${esc(c)}</button>`).join("");
let q=$("search").value.trim().toLowerCase();
let list=products.filter(p=>(active=="الكل"||p.category==active)&&(!q||p.name.toLowerCase().includes(q)));
$("grid").innerHTML=list.map(p=>`<div class="card"><div class="pic">${p.icon||"🛍️"}</div><div class="name">${esc(p.name)}</div><div class="cat">${esc(p.category)}</div><div class="price">${p.price?Number(p.price).toFixed(2)+" ج.م":"السعر يُحدد"}</div></div>`).join("")||"<p>لا توجد منتجات.</p>";
$("adminList").innerHTML=products.map((p,i)=>`<div class="item"><span><b>${esc(p.name)}</b><br><small>${esc(p.category)} — ${p.price?Number(p.price).toFixed(2)+" ج.م":"بدون سعر"}</small></span><span><button class="btn" onclick="editProduct(${i})">تعديل</button> <button class="btn danger" onclick="deleteProduct(${i})">حذف</button></span></div>`).join("");
}
function saveProduct(){
let name=$("name").value.trim(),category=$("category").value.trim();
if(!name||!category)return alert("اكتب اسم المنتج والقسم");
let p={name,price:Number($("price").value)||"",category,icon:$("icon").value.trim()||"🛍️"};
if(edit>=0){products[edit]=p;edit=-1}else products.push(p);
localStorage.setItem("tawakal_products",JSON.stringify(products));
["name","price","category"].forEach(id=>$(id).value="");$("icon").value="🛍️";render();
}
function editProduct(i){let p=products[i];$("name").value=p.name;$("price").value=p.price;$("category").value=p.category;$("icon").value=p.icon||"🛍️";edit=i;window.scrollTo(0,document.body.scrollHeight)}
function deleteProduct(i){if(confirm("حذف المنتج؟")){products.splice(i,1);localStorage.setItem("tawakal_products",JSON.stringify(products));render()}}
$("search").addEventListener("input",render);render();
</script>
</body>
</html>
